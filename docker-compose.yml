# Local infrastructure for the IT Access Request Portal.
#   docker compose up -d                      -> Oracle + Kafka + Mailpit
#   docker compose --profile ui up -d         -> also Kafka UI on http://localhost:8081
#   docker compose --profile gateway up -d    -> also WSO2 API Manager (needs ~3 GB RAM extra)
# Values come from .env (copy .env.example first).

services:
  oracle:
    # Community-maintained Oracle Database Free image (publicly pullable, no Oracle login).
    # "slim-faststart" = smaller image with a pre-built database, so first start takes seconds, not minutes.
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: portal-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      # Creates this user in FREEPDB1 on first start; Flyway creates the tables in its schema.
      APP_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      APP_USER_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    # Official Apache Kafka image, single node in KRaft mode (no ZooKeeper): this one process is both
    # the broker (stores records) and the controller (manages cluster metadata).
    image: apache/kafka:4.2.2
    container_name: portal-kafka
    ports:
      - "9092:9092"   # for the backend on your machine (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners: HOST for apps on your machine, INTERNAL for other containers (Kafka UI),
      # CONTROLLER for the KRaft controller itself.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single node, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Consumers join their group immediately instead of waiting 3s for others (dev only).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the application (NewTopic beans), not by typos in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  mailpit:
    # Fake mail server for development: accepts every email on SMTP :1025 and shows it in a web inbox.
    # Nothing is delivered to real addresses.
    image: axllent/mailpit:v1.31.3
    container_name: portal-mailpit
    ports:
      - "1025:1025"   # SMTP (the backend sends here)
      - "8025:8025"   # web inbox: http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka-ui:
    # Optional web UI to browse topics, messages and consumer groups: docker compose --profile ui up -d
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: portal-kafka-ui
    profiles: ["ui"]
    ports:
      - "8081:8080"   # http://localhost:8081 (8080 is the backend)
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  wso2am:
    # WSO2 API Manager: API gateway + publisher + developer portal + OAuth2 key manager in one server.
    # Heavy (~2-3 GB RAM, ~2 min to start): only with  docker compose --profile gateway up -d
    image: wso2/wso2am:4.7.0
    container_name: portal-wso2am
    profiles: ["gateway"]
    ports:
      - "9443:9443"   # management console, Publisher, Developer Portal, OAuth2 token endpoint
      - "8243:8243"   # API gateway (HTTPS): https://localhost:8243/accessportal/1.0.0/...
      - "8280:8280"   # API gateway (HTTP)
    environment:
      WSO2_ADMIN_PASSWORD: ${WSO2_ADMIN_PASSWORD:?set WSO2_ADMIN_PASSWORD in .env}
      WSO2_ENCRYPTION_KEY: ${WSO2_ENCRYPTION_KEY:?set WSO2_ENCRYPTION_KEY in .env (32 hex characters)}
    volumes:
      - ./infra/wso2/deployment.toml:/home/wso2carbon/wso2am-4.7.0/repository/conf/deployment.toml:ro
    extra_hosts:
      # Lets the gateway reach the Spring Boot backend running on your machine (not in Docker).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:9443/services/Version > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

volumes:
  oracle-data:

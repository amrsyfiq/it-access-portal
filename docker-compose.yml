# Local infrastructure for the IT Access Request Portal.
#   docker compose up -d                      -> Oracle + RabbitMQ
#   docker compose --profile gateway up -d    -> also WSO2 API Manager (needs ~3 GB RAM extra)
# Values come from .env (copy .env.example first).

services:
  oracle:
    # Community-maintained Oracle Database Free image (publicly pullable, no Oracle login).
    # "slim-faststart" = smaller image with a pre-built database, so first start takes seconds, not minutes.
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: portal-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      # Creates this user in FREEPDB1 on first start; Flyway creates the tables in its schema.
      APP_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      APP_USER_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: portal-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-data:
  rabbitmq-data:

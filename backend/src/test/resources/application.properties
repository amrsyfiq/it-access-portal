# Test-only overrides (loaded in addition to src/main/resources/application.yml).
# Every @SpringBootTest shares these, so all test contexts consume from the shared broker the same way.

# Requests for this system make the notification consumer fail -> retries -> dead-letter queue.
portal.notifications.fail-for-system=Always Failing System

# Fast retries so the dead-letter test does not wait seconds.
spring.rabbitmq.listener.simple.retry.initial-interval=100ms
spring.rabbitmq.listener.simple.retry.max-interval=200ms
